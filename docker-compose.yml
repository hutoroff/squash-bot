# Local development only — do NOT use this file or its defaults in production.
# - The Postgres password below is a weak, fixed default (acceptable for a
#   throwaway local DB reachable only from localhost).
# - postgres/management/booking/web ports are published to the host for
#   convenience; docker-compose.prod.yml keeps everything except `web` on the
#   internal Docker network only.
# See docker-compose.prod.yml and the "Trust model" section of README.md for
# the production security posture.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: squash_bot
      POSTGRES_USER: squash_bot
      POSTGRES_PASSWORD: squash_bot # dev-only weak password — never reuse in production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U squash_bot -d squash_bot"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "7432:5432"

  management:
    build:
      context: .
      dockerfile: Dockerfile.management
    environment:
      # sslmode=disable is fine here — traffic stays on the internal Docker
      # network between two containers on localhost, never leaves the host.
      DATABASE_URL: postgres://squash_bot:squash_bot@postgres:5432/squash_bot?sslmode=disable
      SERVER_PORT: "8080"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  telegram:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    env_file: .env
    environment:
      MANAGEMENT_SERVICE_URL: http://management:8080
      # Webhook mode (optional). Local webhook testing needs a tunnel (e.g. cloudflared/ngrok → 8083).
      # Leave unset to use long-polling (the default for local development).
      # TELEGRAM_WEBHOOK_URL: https://<your-tunnel>.trycloudflare.com/telegram/webhook
      # TELEGRAM_WEBHOOK_SECRET: <openssl rand -hex 32>
      # SERVER_PORT: "8083"
    depends_on:
      management:
        condition: service_healthy
    restart: unless-stopped

  booking:
    build:
      context: .
      dockerfile: Dockerfile.booking
    environment:
      SERVER_PORT: "8081"
    env_file: .env
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file: .env
    environment:
      SERVER_PORT: "8082"
      MANAGEMENT_SERVICE_URL: http://management:8080
    depends_on:
      management:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
