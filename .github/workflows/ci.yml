name: CI
run-name: CI — ${{ github.sha }}

on:
  push:
    branches: [main, dev]
  pull_request: { }

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/frontend/.node-version
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Bootstrap generated assets
        run: make bootstrap

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run full verification
        run: make check

  frontend-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/frontend/.node-version
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test
